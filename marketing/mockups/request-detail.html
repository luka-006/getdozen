<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request detail</title>
    <link rel="stylesheet" href="_shared.css" />
  </head>
  <body>
    <div class="atmosphere">
      <header>
        <div class="logo"><div class="logo-mark"></div>Dozen</div>
        <span style="font-size:13px;color:color-mix(in srgb,var(--ink) 55%,transparent)">← Board</span>
      </header>
      <main>
        <p class="eyebrow">Tester run</p>
        <h1>Focus Flow</h1>
        <p class="meta">Android · Productivity app · by Pixel Forge</p>
        <div class="pill pill-blue">Day 5 of 14</div>
        <div class="pill">8 / 12 testers</div>
        <div class="stat-grid">
          <div class="stat"><strong>3</strong><span>Check-ins due</span></div>
          <div class="stat"><strong>4.6</strong><span>Avg rating</span></div>
        </div>
        <div class="surface" style="margin-top:14px">
          <div class="eyebrow" style="margin-bottom:6px">Your progress</div>
          <div class="progress">
            <div class="cube on"></div><div class="cube on"></div><div class="cube mid"></div>
            <div class="cube"></div><div class="cube"></div>
          </div>
          <p class="meta" style="margin-top:10px">Next check-in opens in <strong>18h</strong></p>
        </div>
        <div class="surface">
          <div class="card-title">Install &amp; opt in</div>
          <p class="meta" style="margin-top:6px">Play Console closed test — use the same Google account you registered.</p>
          <button class="btn btn-primary" type="button">Open closed test</button>
        </div>
      </main>
    </div>
  </body>
</html>
