<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review form</title>
    <link rel="stylesheet" href="_shared.css" />
  </head>
  <body>
    <div class="atmosphere">
      <header>
        <div class="logo"><div class="logo-mark"></div>Dozen</div>
        <span style="font-size:13px;color:color-mix(in srgb,var(--ink) 55%,transparent)">Review</span>
      </header>
      <main>
        <p class="eyebrow">Earn dots</p>
        <h1>Campfire Chat</h1>
        <p class="meta">Structured feedback · up to <strong>1.8 Dots</strong></p>
        <label for="q1">Where did you get stuck first?</label>
        <textarea id="q1">Onboarding asked for contacts before I understood the value. I almost bounced.</textarea>
        <label for="q2">Would you pay for this today?</label>
        <textarea id="q2">Maybe at $4/mo if the voice rooms felt less empty on week one.</textarea>
        <label for="q3">One sentence the maker should hear</label>
        <textarea id="q3">Show me one great room before you ask for my phone book.</textarea>
        <button class="btn btn-primary" type="button">Submit review</button>
      </main>
    </div>
  </body>
</html>
