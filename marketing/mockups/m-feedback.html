<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board feedback</title>
    <link rel="stylesheet" href="_shared.css" />
  </head>
  <body>
    <div class="atmosphere">
      <header>
        <div class="logo"><div class="logo-mark"></div>Dozen</div>
        <span style="font-size:13px;font-weight:600;color:var(--blue)">Board</span>
      </header>
      <main>
        <div class="tabs">
          <span class="tab active">Feedback</span>
          <span class="tab">Testers</span>
          <span class="tab">Dozen pack</span>
        </div>
        <div class="surface">
          <div class="row">
            <div class="app-icon" style="background:linear-gradient(145deg,#e9d5ff,#a855f7)"></div>
            <div>
              <div class="card-title">Receipt Snap</div>
              <div class="card-sub">Feedback · Web · Finance</div>
            </div>
          </div>
          <div class="pill pill-blue">6 questions</div>
          <div class="pill pill-credit">0.9 Dots</div>
          <p class="meta" style="margin-top:10px">Thoughtful answers only — no star ratings.</p>
        </div>
        <div class="surface">
          <div class="row">
            <div class="app-icon" style="background:linear-gradient(145deg,#fecdd3,#fb7185)"></div>
            <div>
              <div class="card-title">Orbit Notes</div>
              <div class="card-sub">Feedback · iOS · Writing</div>
            </div>
          </div>
          <div class="pill pill-blue">4 questions</div>
          <div class="meta" style="margin-top:10px">2 slots left</div>
        </div>
      </main>
    </div>
  </body>
</html>
