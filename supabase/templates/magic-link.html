<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#f4f6fb">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6fb;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px">
            <tr>
              <td style="padding:28px;font-family:system-ui,-apple-system,sans-serif;color:#0b1f3a">
                <p style="margin:0 0 8px;font-size:18px;font-weight:700">Dozen</p>
                <h1 style="margin:0 0 12px;font-size:22px">Your sign-in code</h1>
                <p style="margin:0 0 16px;font-size:32px;letter-spacing:0.28em;font-weight:700;font-family:ui-monospace,monospace">{{ .Token }}</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.55;color:#475569">
                  Enter this code on getdozen.dev. It expires in one hour.
                </p>
                {{ if .Data }}{{ if .Data.referral_url }}
                <p style="margin:0 0 8px;font-size:15px;line-height:1.55;color:#475569">
                  {{ if .Data.referral_line }}{{ .Data.referral_line }}{{ end }}
                </p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.55">
                  <a href="{{ .Data.referral_url }}">{{ .Data.referral_url }}</a>
                </p>
                {{ end }}{{ end }}
                <p style="margin:0">
                  <a href="{{ .SiteURL }}/login" style="display:inline-block;padding:12px 22px;background:#1E4FD8;color:#ffffff;text-decoration:none;border-radius:8px;font-weight:600;font-size:15px">Open sign-in</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
