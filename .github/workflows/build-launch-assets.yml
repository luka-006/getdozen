name: Build launch marketing assets

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-launch-assets.yml"
      - "scripts/generate-launch-video.ts"
      - "scripts/capture-marketing-mockups.ts"
      - "marketing/mockups/**"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build launch videos (mock mode)
        run: npm run launch:assets

      - name: Verify video sizes
        run: |
          for f in \
            marketing/dozen-launch-preview.mp4 \
            marketing/dozen-launch-horizontal.mp4 \
            public/marketing/dozen-launch-preview.mp4 \
            public/marketing/dozen-launch-horizontal.mp4
          do
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            test "$size" -gt 100000 || { echo "File too small: $f"; exit 1; }
          done

      - name: Commit and push assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/dozen-launch-*.mp4 public/marketing/dozen-launch-*.mp4
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "build: regenerate launch marketing videos"
          git push
