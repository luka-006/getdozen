name: Seed John promo profile

concurrency:
  group: seed-john-profile
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      include_preview_seed:
        description: "Also run seed-preview-data --force first (peer reviews / thanks helpers)"
        type: boolean
        default: true
      force:
        description: "Pass --force to reseed even if demo data exists"
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - .github/seed-john-profile.trigger

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse production seed
        run: |
          echo "Seed paths do not run from this workflow."
          echo "Demo posts and Wall of Fame sample apps must not be written to production."
          echo "A non-production database can still be seeded with scripts/seed-preview-data.ts when VERCEL_ENV is not production."
          exit 1
